# Configuration cargo-deny (job « Qualité » de la CI — `cargo deny check`).
# Contrôle (D3) : advisories (RustSec) + licences autorisées + sources + doublons.
#
# Politique : les VULNÉRABILITÉS bloquent toujours. Les advisories
# « unmaintained » ci-dessous sont ignorées EXPLICITEMENT car elles viennent
# de la pile Linux de Tauri (wry/tao → bindings GTK3, glib, proc-macro-error…)
# sur laquelle nous n'avons pas la main tant que Tauri n'a pas migré (GTK4).
# À réévaluer à chaque montée de version de Tauri.

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error non maintenu — dépendance transitive de la pile Tauri/GTK" },
    { id = "RUSTSEC-2024-0411", reason = "bindings GTK3 non maintenus — pile Linux de Tauri, migration GTK4 suivie en amont" },
    { id = "RUSTSEC-2024-0412", reason = "bindings GTK3 non maintenus — pile Linux de Tauri" },
    { id = "RUSTSEC-2024-0413", reason = "bindings GTK3 non maintenus — pile Linux de Tauri" },
    { id = "RUSTSEC-2024-0414", reason = "bindings GTK3 non maintenus — pile Linux de Tauri" },
    { id = "RUSTSEC-2024-0415", reason = "bindings GTK3 non maintenus — pile Linux de Tauri" },
    { id = "RUSTSEC-2024-0416", reason = "bindings GTK3 non maintenus — pile Linux de Tauri" },
    { id = "RUSTSEC-2024-0417", reason = "bindings GTK3 non maintenus — pile Linux de Tauri" },
    { id = "RUSTSEC-2024-0418", reason = "bindings GTK3 non maintenus — pile Linux de Tauri" },
    { id = "RUSTSEC-2024-0419", reason = "bindings GTK3 non maintenus — pile Linux de Tauri" },
    { id = "RUSTSEC-2024-0420", reason = "bindings GTK3 non maintenus — pile Linux de Tauri" },
    { id = "RUSTSEC-2025-0075", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
    { id = "RUSTSEC-2025-0080", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
    { id = "RUSTSEC-2025-0081", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
    { id = "RUSTSEC-2025-0098", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
    { id = "RUSTSEC-2025-0100", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
]

[licenses]
# Liste blanche EXPLICITE : toute licence hors liste casse la CI (revue humaine
# requise avant d'en ajouter une). Couvre la pile git2/reqwest/tokio/rusqlite/tauri.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[[licenses.exceptions]]
# `ring` agrège plusieurs licences (dont OpenSSL) de façon non-SPDX : toléré ici.
allow = ["OpenSSL"]
name = "ring"

[bans]
# Doublons de versions et dépendances joker : signalés (hygiène), non bloquants.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Seul crates.io est approuvé ; toute source git/registre inconnue est refusée
# (empêche une substitution silencieuse de dépendance).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
