# Configuration cargo-deny (job « Qualité » de la CI — check advisories).
#
# Politique : les VULNÉRABILITÉS bloquent toujours. Les advisories
# « unmaintained » ci-dessous sont ignorées EXPLICITEMENT car elles viennent
# de la pile Linux de Tauri (wry/tao → bindings GTK3, glib, proc-macro-error…)
# sur laquelle nous n'avons pas la main tant que Tauri n'a pas migré (GTK4).
# À réévaluer à chaque montée de version de Tauri.

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error non maintenu — dépendance transitive de la pile Tauri/GTK" },
