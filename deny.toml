# Configuration cargo-deny (job « Qualité » de la CI — `cargo deny check`).
# Contrôle (D3) : advisories (RustSec) + licences autorisées + sources + doublons.
#
# Politique : les VULNÉRABILITÉS bloquent toujours. Les advisories
# « unmaintained » ci-dessous sont ignorées EXPLICITEMENT car elles viennent
# de la pile Linux de Tauri (wry/tao → bindings GTK3, glib, proc-macro-error…)
# sur laquelle nous n'avons pas la main tant que Tauri n'a pas migré (GTK4).
# À réévaluer à chaque montée de version de Tauri.

[advisories]
# PORTÉE « all », ET PAS LE DÉFAUT. cargo-deny évalue par défaut les advisories
# `unsound` sur la seule portée `workspace` : une advisory qui ne frappe qu'une
# crate TRANSITIVE n'est alors ni signalée ni ignorée — elle est invisible.
#
# Dans une application Tauri, cette portée revient à ne rien regarder : tout ce
# qui compte est transitif. Le 18/09/2026, Dependabot signalait RUSTSEC-2024-0429
# (glib) pendant que ce fichier restait muet, et l'écart ne venait pas d'un
# désaccord de politique mais d'une politique JAMAIS ÉCRITE. Les deux valeurs
# ci-dessous sont donc posées, même là où elles rejoignent le défaut du jour :
# une politique de sécurité qui dépend du défaut d'un outil n'est pas une
# politique. Mesuré : les ouvrir fait apparaître exactement une advisory, celle
# que Dependabot signalait — ni plus, ni moins.
unmaintained = "all"
unsound = "all"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error non maintenu — dépendance transitive de la pile Tauri/GTK" },
    { id = "RUSTSEC-2024-0429", reason = "glib < 0.20 : unsound dans VariantStrIter. Tiré par la pile GTK de Tauri (gtk, gdk, gio, pango, webkit2gtk…), qui n'est compilée QUE pour une cible Linux. Or `cargo check -p mc-desktop` ne tourne que sur Windows/MSVC et `release.yml` ne produit que du Windows : ce code n'entre dans aucun binaire livré. Le correctif exige glib 0.20, donc la génération gtk 0.20, donc une génération de Tauri plus récente — pas actionnable ici. À rouvrir le jour où une cible Linux entre dans release.yml." },
    { id = "RUSTSEC-2025-0075", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
    { id = "RUSTSEC-2025-0080", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
    { id = "RUSTSEC-2025-0081", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
    { id = "RUSTSEC-2025-0098", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
    { id = "RUSTSEC-2025-0100", reason = "dépendance transitive de la pile Tauri — non actionnable localement, réévaluer aux montées de version" },
]

[licenses]
# Liste blanche EXPLICITE : toute licence hors liste casse la CI (revue humaine
# requise avant d'en ajouter une). Couvre la pile git2/reqwest/tokio/rusqlite/tauri.
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[[licenses.exceptions]]
# `ring` agrège plusieurs licences (dont OpenSSL) de façon non-SPDX : toléré ici.
allow = ["OpenSSL"]
name = "ring"

[bans]
# Doublons de versions et dépendances joker : signalés (hygiène), non bloquants.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Seul crates.io est approuvé ; toute source git/registre inconnue est refusée
# (empêche une substitution silencieuse de dépendance).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
