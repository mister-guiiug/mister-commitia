[package]
name = "mc-core"
description = "Cœur de mister-commitia : analyse Git, plans de réécriture gouvernés, skills IA, politiques de rétention CI/CD"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
git2 = { version = "0.21", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
regex = "1"
once_cell = "1"
base64 = "0.22"
tracing = "0.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
# native-tls : schannel sous Windows (magasin de certificats système, compatible
# proxys TLS d'entreprise), openssl sous Linux, Security.framework sous macOS.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# timers uniquement : attentes annulables du retry/backoff IA (T11) — le
# runtime lui-même est fourni par l'appelant (Tauri ou #[tokio::test]).
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
git2 = { version = "0.21", default-features = false }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
