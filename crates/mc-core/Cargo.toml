[package]
name = "mc-core"
description = "Cœur de mister-commitia : analyse Git, plans de réécriture gouvernés, skills IA, politiques de rétention CI/CD"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
git2 = { version = "0.21", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.2.0"
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.3", features = ["v4"] }
sha2 = "0.11.1"
regex = "1.13.2"
once_cell = "1.21.4"
base64 = "0.23.1"
tracing = "0.1.44"
keyring = "4.2.0"
# native-tls : schannel sous Windows (magasin de certificats système, compatible
# proxys TLS d'entreprise), openssl sous Linux, Security.framework sous macOS.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "query"] }
# timers uniquement : attentes annulables du retry/backoff IA (T11) — le
# runtime lui-même est fourni par l'appelant (Tauri ou #[tokio::test]).
tokio = { version = "1.54.1", default-features = false, features = ["time"] }

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
git2 = { version = "0.21", default-features = false }
serde_json = "1.0.154"
chrono = { version = "0.4.45", features = ["serde"] }
keyring = "4.2.0"
