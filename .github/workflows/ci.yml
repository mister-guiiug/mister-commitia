name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Tests mc-core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MC_SECRETS_MODE: memory
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.org
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.org
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests du cœur
        run: cargo test -p mc-core --locked
      - name: Compilation du binaire desktop (Windows/MSVC)
        if: runner.os == 'Windows'
        run: cargo check -p mc-desktop --locked

  qualite:
    name: Qualité (fmt, clippy, chaîne d'appro)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatage
        run: cargo fmt --all --check
      - name: Clippy (zéro warning)
        run: cargo clippy -p mc-core --all-targets --locked -- -D warnings
      - name: Chaîne d'appro (advisories + licences + sources)
        # D3 : check COMPLET (plus seulement advisories) — licences hors liste
        # blanche, sources non-crates.io et doublons sont désormais contrôlés.
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Nouvelles dépendances vs base (revue sur PR)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          git show "origin/${{ github.base_ref }}:Cargo.lock" > /tmp/base.lock 2>/dev/null || : > /tmp/base.lock
          grep '^name = ' Cargo.lock | sort -u > /tmp/head.names
          grep '^name = ' /tmp/base.lock | sort -u > /tmp/base.names || : > /tmp/base.names
          added="$(comm -13 /tmp/base.names /tmp/head.names || true)"
          if [ -n "$added" ]; then
            n="$(printf '%s\n' "$added" | grep -c '^name' || true)"
            echo "::warning title=Nouvelles dépendances::$n dépendance(s) ajoutée(s) — revue chaîne d'appro requise"
            printf '%s\n' "$added" | sed 's/^name = /  - /'
          else
            echo "Aucune nouvelle dépendance vs ${{ github.base_ref }}."
          fi

  couverture:
    name: Couverture (plan-engine ≥ 80%)
    runs-on: ubuntu-latest
    env:
      MC_SECRETS_MODE: memory
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.org
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.org
    steps:
      - uses: actions/checkout@v7
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Mesure de couverture (mc-core)
        run: cargo llvm-cov --locked -p mc-core --json --output-path cov.json --ignore-filename-regex 'tests/'
      - name: Gate ≥ 80% sur plan-engine (DoD §9.2)
        run: |
          python3 - <<'PY'
          import json, sys
          data = json.load(open("cov.json"))
          d = data["data"][0]
          plan = next((f for f in d["files"] if f["filename"].replace("\\", "/").endswith("src/plan.rs")), None)
          if not plan:
              print("::error::plan.rs introuvable dans le rapport de couverture"); sys.exit(1)
          pct = plan["summary"]["lines"]["percent"]
          tot = d["totals"]["lines"]["percent"]
          print(f"Couverture lignes plan.rs : {pct:.1f}%")
          print(f"Couverture lignes mc-core (global) : {tot:.1f}%")
          if pct < 80.0:
              print(f"::error::couverture plan.rs {pct:.1f}% < 80% (DoD §9.2)"); sys.exit(1)
          PY

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Installer cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: Générer le SBOM (espace de travail)
        # cargo-cyclonedx n'a pas de -p : il ecrit un SBOM adjacent a chaque
        # Cargo.toml de membre (mc-core, mc-desktop). Nom de fichier selon la
        # version : bom.json (recent) ou <crate>.cdx.json (ancien).
        run: cargo cyclonedx --format json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            **/bom.json
            **/*.cdx.json
          if-no-files-found: error

  front:
    name: Build front (type-check + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e-web:
    name: E2E interface (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E (build web + mock IPC)
        run: npm run e2e

  # E2E DESKTOP natifs (WebView2) — expérimental, à la demande uniquement :
  # l'app native ne compile pas sur tout poste et la session WebDriver dépend de
  # l'environnement du runner (msedgedriver/WebView2). Les E2E Playwright ci-dessus
  # couvrent l'UI à chaque push.
  #
  # MODE « ATTACH » DEPUIS LE 25/09/2026. Vert le 24/07, rouge ensuite sur
  # windows-latest : « session not created: DevToolsActivePort file doesn't
  # exist ». L'app démarrait bien (sa base était créée) ; c'est la WebView2
  # (152, puis 153) qui n'ouvrait plus le port de débogage que msedgedriver lui
  # demande par WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS. wry pose toujours ses
  # propres arguments par l'API, et les runtimes récents les font primer sur la
  # variable. Sonde à l'appui : même `--remote-debugging-port` passé par la
  # variable, le port reste fermé ; posé par la config de l'app, il s'ouvre.
  # Même symptôme, sans cause, dans actions/runner-images#14738.
  #
  # D'où : un BUILD DE TEST dont la config ouvre le port (tauri-e2e-config.cjs),
  # l'app lancée par le test, et msedgedriver qui s'y attache. Le pilote suit la
  # version de la WEBVIEW2, pas celle d'Edge : sur windows-2022 les deux
  # divergent (131 contre 152).
  e2e-desktop:
    name: E2E desktop (WebView2, expérimental)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build de test (port de débogage ouvert par la config)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          npm ci
          $surcharge = "$env:RUNNER_TEMP\tauri.e2e.conf.json"
          node e2e-native/tauri-e2e-config.cjs $surcharge
          npx tauri build --no-bundle --config $surcharge
      - name: msedgedriver à la version exacte de la WebView2
        shell: pwsh
        run: |
          $cle = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients'
          $webview2 = (Get-ItemProperty "$cle\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}").pv
          $edge = (Get-ItemProperty "$cle\{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}" -ErrorAction SilentlyContinue).pv
          "Image : $env:ImageOS $env:ImageVersion · WebView2 $webview2 · Edge $edge"
          $dossier = "$env:RUNNER_TEMP\msedgedriver-$webview2"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$webview2/edgedriver_win64.zip" -OutFile "$dossier.zip"
          Expand-Archive "$dossier.zip" -DestinationPath $dossier -Force
          & "$dossier\msedgedriver.exe" --version
          "MSEDGEDRIVER=$dossier\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: E2E natifs
        working-directory: apps/desktop/e2e-native
        run: |
          npm install
          npm test
      - name: Diagnostic après échec
        if: failure()
        shell: pwsh
        run: |
          "== Port de débogage de l'app"
          try { Invoke-RestMethod http://127.0.0.1:9222/json/version -TimeoutSec 3 } catch { "fermé : $($_.Exception.Message)" }
          "== Dossier de données de l'app (a-t-elle démarré ?)"
          $donnees = "$env:APPDATA\com.guiiug.mistercommitia"
          if (Test-Path $donnees) { Get-ChildItem $donnees | ForEach-Object { $_.Name } } else { "absent" }
          "== Processus restants"
          Get-Process mister-commitia, mc-desktop, msedgewebview2, msedgedriver -ErrorAction SilentlyContinue |
            Select-Object Name, Id | Format-Table | Out-String

  # Les tags v* passent par release.yml (bundles + GitHub Release) ;
  # ce job ne sert qu'aux tests de packaging à la demande.
  bundle-windows:
    name: Bundle Windows (MSI/NSIS)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tauri build
        working-directory: apps/desktop
      - name: Assemblage de la version portable (exe + skills + LISEZMOI, zip)
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exe = @("target/release/mister-commitia.exe", "target/release/mc-desktop.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "binaire release introuvable" }
          $dir = "portable/mister-commitia"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $exe "$dir/mister-commitia.exe"
          Copy-Item -Recurse skills "$dir/skills"
          @"
          mister-commitia $version — version portable (x64)
          ================================================

          Aucune installation : lancer mister-commitia.exe directement.
          Le dossier skills/ doit rester a cote de l'executable.

          Prerequis : WebView2 Runtime (present d'office sur Windows 10/11 a jour ;
          sinon https://developer.microsoft.com/microsoft-edge/webview2/).

          Donnees : par defaut dans %APPDATA%\com.guiiug.mistercommitia.
          Pour un mode 100 % portable, definir la variable d'environnement
          MC_DATA_DIR (ex. le dossier de l'executable) avant lancement.
          Les tokens restent TOUJOURS dans le coffre Windows (Credential Manager),
          jamais dans les fichiers de l'application.
          "@ -replace "(?m)^          ", "" | Set-Content "$dir/LISEZMOI.txt" -Encoding utf8
          Compress-Archive -Path $dir -DestinationPath "portable/mister-commitia_${version}_x64_portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            portable/*.zip
