name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Tests mc-core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MC_SECRETS_MODE: memory
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.org
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.org
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests du cœur
        run: cargo test -p mc-core --locked
      - name: Compilation du binaire desktop (Windows/MSVC)
        if: runner.os == 'Windows'
        run: cargo check -p mc-desktop --locked

  front:
    name: Build front (type-check + vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  bundle-windows:
    name: Bundle Windows (MSI/NSIS)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/desktop
      - run: npx tauri build
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
