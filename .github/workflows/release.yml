name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gate:
    name: Tests avant release
    runs-on: ubuntu-latest
    env:
      MC_SECRETS_MODE: memory
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.org
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.org
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cohérence tag ↔ version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "::error::le tag v$TAG ne correspond pas à la version $VER (tauri.conf.json)"
            exit 1
          fi
      - name: Tests du cœur
        run: cargo test -p mc-core --locked

  release-windows:
    name: Bundles Windows + GitHub Release
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: write # créer la Release
      id-token: write # provenance SLSA (D2)
      attestations: write # provenance SLSA (D2)
    # Signature Authenticode (T8) : fournir un certificat OV/EV en secrets
    # (WINDOWS_CERT_BASE64 = PFX encodé base64, WINDOWS_CERT_PASSWORD). Sans
    # secret, les bundles restent non signés (SmartScreen).
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      # Updater signé : clé privée minisign (générée par `npx tauri signer generate`).
      # Sans ce secret, `createUpdaterArtifacts` reste OFF → build normal non signé.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/desktop
      - name: Build (+ artefacts updater signés si clé fournie)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          } else {
            Write-Host "::warning::pas de TAURI_SIGNING_PRIVATE_KEY — updater NON signe (createUpdaterArtifacts off)"
            npx tauri build
          }
      - name: Signature Authenticode (si certificat fourni)
        if: env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1).FullName
          $targets = @(Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue) +
                     @(Get-ChildItem target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue) +
                     @(Get-ChildItem target/release/mister-commitia.exe -ErrorAction SilentlyContinue)
          foreach ($t in $targets) {
            & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $t.FullName
          }
          Remove-Item $pfx -Force
      - name: Bundles non signés (aucun certificat)
        if: env.WINDOWS_CERT_BASE64 == ''
        shell: pwsh
        run: Write-Host "::warning::aucun certificat (secret WINDOWS_CERT_BASE64) — bundles NON signés (SmartScreen)."
      - name: Assemblage de la version portable (exe + skills + LISEZMOI, zip)
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exe = @("target/release/mister-commitia.exe", "target/release/mc-desktop.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "binaire release introuvable" }
          $dir = "portable/mister-commitia"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item $exe "$dir/mister-commitia.exe"
          Copy-Item -Recurse skills "$dir/skills"
          @"
          mister-commitia $version — version portable (x64)
          ================================================

          Aucune installation : lancer mister-commitia.exe directement.
          Le dossier skills/ doit rester a cote de l'executable.

          Prerequis : WebView2 Runtime (present d'office sur Windows 10/11 a jour ;
          sinon https://developer.microsoft.com/microsoft-edge/webview2/).

          Donnees : par defaut dans %APPDATA%\com.guiiug.mistercommitia.
          Pour un mode 100 % portable, definir la variable d'environnement
          MC_DATA_DIR (ex. le dossier de l'executable) avant lancement.
          Les tokens restent TOUJOURS dans le coffre Windows (Credential Manager),
          jamais dans les fichiers de l'application.
          "@ -replace "(?m)^          ", "" | Set-Content "$dir/LISEZMOI.txt" -Encoding utf8
          Compress-Archive -Path $dir -DestinationPath "portable/mister-commitia_${version}_x64_portable.zip"
      - name: Sommes de contrôle SHA-256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem target/release/bundle/msi/*.msi) +
                   @(Get-ChildItem target/release/bundle/nsis/*.exe) +
                   @(Get-ChildItem portable/*.zip)
          $lines = foreach ($f in $files) {
            "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name
          }
          $lines | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
      - name: Attestation de provenance (SLSA, D2)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            portable/*.zip
      - name: Créer la GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @((Get-ChildItem target/release/bundle/msi/*.msi).FullName) +
                    @((Get-ChildItem target/release/bundle/nsis/*.exe).FullName) +
                    @((Get-ChildItem portable/*.zip).FullName) +
                    @("SHA256SUMS.txt")
          gh release create $env:GITHUB_REF_NAME `
            --title "mister-commitia $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag `
            @assets

  # D1 — bundles Linux (.deb/.AppImage) et macOS (.dmg), publiés sur la MÊME
  # Release (créée par le job Windows). Chaque plateforme atteste sa provenance
  # (D2). Non signés (pas de certificat Apple/Linux fourni) — documenté.
  release-unix:
    name: Bundles ${{ matrix.os }}
    needs: [gate, release-windows]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # publier sur la Release
      id-token: write # provenance SLSA (D2)
      attestations: write # provenance SLSA (D2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # Updater signé (idem Windows) : clé privée minisign gated sur secret.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/desktop
      - name: Build (+ artefacts updater signés si clé fournie)
        working-directory: apps/desktop
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::pas de TAURI_SIGNING_PRIVATE_KEY — updater NON signé (createUpdaterArtifacts off)"
            npx tauri build
          fi
      - name: Collecte des bundles + sommes de contrôle
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for f in target/release/bundle/deb/*.deb \
                   target/release/bundle/appimage/*.AppImage \
                   target/release/bundle/rpm/*.rpm \
                   target/release/bundle/dmg/*.dmg; do
            cp "$f" dist/
          done
          cd dist
          files="$(ls)"
          if [ -z "$files" ]; then echo "::error::aucun bundle produit"; exit 1; fi
          if command -v sha256sum >/dev/null; then
            sha256sum $files > "SHA256SUMS-${RUNNER_OS}.txt"
          else
            shasum -a 256 $files > "SHA256SUMS-${RUNNER_OS}.txt"
          fi
          cat "SHA256SUMS-${RUNNER_OS}.txt"
      - name: Attestation de provenance (SLSA, D2)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Publication sur la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
